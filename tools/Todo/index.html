<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do List App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>📝 My To-Do List</h1>
        
        <div class="input-container">
            <input 
                type="text" 
                id="taskInput" 
                placeholder="Add a new task..."
                autocomplete="off"
            >
            <button id="addBtn">Add</button>
        </div>

        <ul id="taskList"></ul>
        <div id="emptyMessage" class="empty-message">No tasks yet. Add one to get started!</div>
        
        <div class="stats">
            <p>Total: <span id="totalCount">0</span> | Completed: <span id="completedCount">0</span></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
