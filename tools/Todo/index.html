<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do List App</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
    <header class="header">
        <div class="header-container">
            <a href="../index.html" class="logo">AS</a>
            <nav class="navigation">
                <a href="../index.html#hero" class="anchor">Home</a>
                <a href="../index.html#about" class="anchor">About</a>
                <a href="../projects.html" class="anchor">Projects</a>
                <a href="../tools/index.html" class="anchor">Tools</a>
                <a href="../contact.html" class="anchor">Contact</a>
            </nav>
        </div>
    </header>

    <div class="container">
        <h1>📝 My To-Do List</h1>
        
        <div class="input-container">
            <input 
                type="text" 
                id="taskInput" 
                placeholder="Add a new task..."
                autocomplete="off"
            >
            <button id="addBtn">Add</button>
        </div>

        <ul id="taskList"></ul>
        <div id="emptyMessage" class="empty-message">No tasks yet. Add one to get started!</div>
        
        <div class="stats">
            <p>Total: <span id="totalCount">0</span> | Completed: <span id="completedCount">0</span></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
