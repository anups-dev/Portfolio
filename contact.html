    <h1 class="contact-title">Contact Me</h1>
    <div class="contact-container">
        <form class="contact-form" action="/api/contact" method="POST">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required placeholder="Jon Doe">

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required placeholder="jon.doe@example.com">

            <label for="message">Message:</label>
            <textarea id="message" name="message" rows="5" required placeholder="Your message here..."></textarea>

            <button type="submit" class="button">Send Message</button>
        </form>
    </div>
